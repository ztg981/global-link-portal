# Builds the desktop app and publishes it to GitHub Releases.
# electron-updater in installed apps reads latest.yml / latest-mac.yml from the
# newest release, so pushing a tag like v0.1.1 ships an update to everyone.
#   1. bump "version" in desktop/package.json   2. git tag v0.1.1 && git push origin v0.1.1
# One job makes a draft release, both builds upload into it, then it is published
# (so the Windows and Mac jobs can't race and create two releases).
name: Release desktop app
on:
  push: { tags: ['v*'] }
permissions: { contents: write }
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --title "Global Link ${GITHUB_REF_NAME#v}" --notes "Download for Windows (Global-Link-Setup.exe) or Mac (arm64 = Apple silicon, x64 = Intel). Installed apps update automatically."
  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Build and upload
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false --latest
